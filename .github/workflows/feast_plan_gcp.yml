name: Feast plan (GCP)

on:
  pull_request:

permissions:
  contents: read

jobs:
  feast-plan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Install Feast with GCP dependencies
        run: python -m pip install "feast[gcp]==0.66.0" gcsfs

      - name: Run Feast plan
        run: |
          cd module_0/feature_repo_gcp
          feast plan